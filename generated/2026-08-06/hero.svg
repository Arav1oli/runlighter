<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14241f" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#14241f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#14241f" stop-opacity="0.44"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="900" y="46" width="650" height="808" rx="24"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#14241f"/>
  <image xlink:href="ai-source.png" x="-40" y="-40" width="1680" height="980" preserveAspectRatio="xMidYMid slice" filter="url(#blur)" opacity="0.68"/>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <image xlink:href="ai-source.png" x="900" y="46" width="650" height="808" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  <rect x="900" y="46" width="650" height="808" rx="24" fill="none" stroke="#d2b25b" stroke-width="2"/>
  <rect x="74" y="66" width="258" height="52" rx="26" fill="#efe7d5"/>
  <text x="102" y="100" fill="#20352d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="3">RUN / LIGHTER</text>
  <text x="74" y="284" fill="#efe7d5" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800">EXTRA WORK.</text>
  <text x="74" y="382" fill="#e07856" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800">ZERO INVOICE.</text>
  <line x1="78" y1="426" x2="420" y2="426" stroke="#d2b25b" stroke-width="7"/>
  <text x="74" y="490" fill="#efe7d5" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">The firm delivered more than it billed.</text>
  <text x="74" y="532" fill="#d8d2c4" font-family="Arial, Helvetica, sans-serif" font-size="27">The scope decision never reached the invoice path.</text>
  <rect x="74" y="614" width="748" height="112" rx="14" fill="#efe7d5" fill-opacity="0.95"/>
  <text x="108" y="661" fill="#20352d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="1.3">14:06 APPROVED</text>
  <text x="324" y="661" fill="#a64c37" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">→</text>
  <text x="374" y="661" fill="#20352d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="1.3">FRIDAY INVOICE UNCHANGED</text>
  <text x="108" y="699" fill="#536158" font-family="Arial, Helvetica, sans-serif" font-size="20">Routine movement can connect. Fee judgement stays human.</text>
  <text x="74" y="848" fill="#efe7d5" font-family="Arial, Helvetica, sans-serif" font-size="21">This post has been automated so we can run lighter.</text>
