*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{font-family:"Avenir Next Condensed","Arial Narrow",Arial,sans-serif}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;background:#f3efe5;color:#29312c}

.veil{position:absolute;inset:0;pointer-events:none}

.headline{position:absolute;z-index:3;margin:0;font-weight:800;letter-spacing:-3.5px;line-height:.91;text-transform:uppercase;text-wrap:balance}
.rule{position:absolute;z-index:3;height:8px;border-radius:999px}
