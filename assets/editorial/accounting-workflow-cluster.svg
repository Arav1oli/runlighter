<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Accounting workflow handoff map</title>
  <desc id="desc">Four stages move from client request to work ready, human review and recorded outcome, with exceptions stopping for judgement.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3efe5"/><stop offset="1" stop-color="#dfe4d7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#273029" flood-opacity=".12"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="100" r="280" fill="#b96f4b" opacity=".10"/><circle cx="80" cy="820" r="330" fill="#718069" opacity=".14"/>
  <text x="120" y="135" fill="#718069" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">RUN LIGHTER · ACCOUNTING WORKFLOW</text>
  <text x="120" y="210" fill="#273029" font-family="Arial,sans-serif" font-size="55" font-weight="700">Make the handoff visible.</text>
  <g transform="translate(120 330)" filter="url(#shadow)">
    <g><rect width="285" height="230" rx="24" fill="#fbf8f1"/><circle cx="52" cy="55" r="23" fill="#b96f4b"/><text x="52" y="64" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">1</text><text x="35" y="120" fill="#273029" font-family="Arial" font-size="28" font-weight="700">Trigger</text><text x="35" y="158" fill="#667068" font-family="Arial" font-size="21">A request, document</text><text x="35" y="188" fill="#667068" font-family="Arial" font-size="21">or status changes.</text></g>
    <path d="M305 115h70" stroke="#718069" stroke-width="10" stroke-linecap="round"/><path d="m358 96 20 19-20 19" fill="none" stroke="#718069" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(395)"><rect width="285" height="230" rx="24" fill="#fbf8f1"/><circle cx="52" cy="55" r="23" fill="#c39a4b"/><text x="52" y="64" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">2</text><text x="35" y="120" fill="#273029" font-family="Arial" font-size="28" font-weight="700">Prepare</text><text x="35" y="158" fill="#667068" font-family="Arial" font-size="21">Collect context and</text><text x="35" y="188" fill="#667068" font-family="Arial" font-size="21">check completeness.</text></g>
    <path d="M700 115h70" stroke="#718069" stroke-width="10" stroke-linecap="round"/><path d="m753 96 20 19-20 19" fill="none" stroke="#718069" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(790)"><rect width="285" height="230" rx="24" fill="#344137"/><circle cx="52" cy="55" r="23" fill="#f3efe5"/><text x="52" y="64" text-anchor="middle" fill="#344137" font-family="Arial" font-size="22" font-weight="700">3</text><text x="35" y="120" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Human review</text><text x="35" y="158" fill="#dfe4d7" font-family="Arial" font-size="21">Judgement, fee and</text><text x="35" y="188" fill="#dfe4d7" font-family="Arial" font-size="21">exceptions stop here.</text></g>
    <path d="M1095 115h70" stroke="#718069" stroke-width="10" stroke-linecap="round"/><path d="m1148 96 20 19-20 19" fill="none" stroke="#718069" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1185)"><rect width="285" height="230" rx="24" fill="#fbf8f1"/><circle cx="52" cy="55" r="23" fill="#718069"/><text x="52" y="64" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">4</text><text x="35" y="120" fill="#273029" font-family="Arial" font-size="28" font-weight="700">Read back</text><text x="35" y="158" fill="#667068" font-family="Arial" font-size="21">Confirm the outcome</text><text x="35" y="188" fill="#667068" font-family="Arial" font-size="21">in the trusted system.</text></g>
  </g>
  <g transform="translate(510 685)"><rect width="580" height="100" rx="50" fill="#efe2d7"/><path d="M55 50h48" stroke="#b96f4b" stroke-width="9" stroke-linecap="round"/><path d="M79 26v48" stroke="#b96f4b" stroke-width="9" stroke-linecap="round"/><text x="130" y="59" fill="#344137" font-family="Arial" font-size="26" font-weight="700">Exceptions stay with the accountable person.</text></g>
</svg>
